# SchoolMate AI 앱(GitHub Pages)을 만들어 올리고, 컴시간알리미 시간표를 timetable.json으로 함께 올린다.
# 시각은 claude.ai 루틴과 같다(한국 시간 = UTC+9): 평일 8:15, 1~7교시 시작 25분 뒤, 일요일 19:51.
name: SchoolMate app

on:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/app.yml'
  schedule:
    - cron: '15 23 * * 0-4'   # 월~금 08:15
    - cron: '5 0-3 * * 1-5'   # 월~금 09:05, 10:05, 11:05, 12:05
    - cron: '55 4-6 * * 1-5'  # 월~금 13:55, 14:55, 15:55
    - cron: '51 10 * * 0'     # 일 19:51
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages deploys from the default branch only
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test scripts
        run: node --test scripts/*.test.mjs
      - name: Build app
        run: node scripts/build-app.mjs --out _site
      - name: Timetable from 컴시간알리미
        run: |
          # the last published copy keeps the past weeks (comcigan-sync.mjs merges them)
          owner="${GITHUB_REPOSITORY%%/*}"
          base="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --max-time 20 "$base/timetable.json?t=$(date +%s)" -o prev.json || echo '{}' > prev.json
          if node scripts/comcigan-sync.mjs --out _site/timetable.json --prev prev.json; then
            echo "컴시간알리미에서 새로 받았어요"
          else
            echo "::warning::컴시간알리미에서 받지 못해 지난 시간표를 그대로 올려요"
            cp prev.json _site/timetable.json
          fi
      # Pages must be switched on by hand: Settings → Pages → Source: GitHub Actions (the workflow token cannot).
      # Until then the run ends here without failing.
      - id: check
        name: Is GitHub Pages on?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" | jq -r '.build_type // empty' || true)
          if [ "$type" = workflow ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages가 아직 꺼져 있어요(${type:-없음}). Settings → Pages → Source를 GitHub Actions로 바꾸면 다음 실행부터 앱이 올라가요."
          fi
      - if: steps.check.outputs.on == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.check.outputs.on == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
